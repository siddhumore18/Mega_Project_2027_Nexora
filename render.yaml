services:
  # Nexora Backend & Python Optimizer Web Service
  - type: web
    name: nexora-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: WEB_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString

databases:
  # Free PostgreSQL Database on Render
  - name: nexora-db
    plan: free
    region: oregon
    databaseName: nexora
    user: nexora_user

